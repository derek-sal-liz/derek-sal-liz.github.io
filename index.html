<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>New England Blog</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
    </style>
  </head>
  <body>
    <header id="site-header" class="w-full px-10 py-10 flex flex-col items-center text-center">
      <h1 class="serif text-5xl md:text-6xl font-bold tracking-tight" py-4 style="color: var(--header-text);">
        The Commonwealth
      </h1>
      <p class="py-4 tagline mb-3">For fans of New England</p>
      <hr class="rule w-24 mt-2 mb-4" />
    </header>

    <div class = "flex flex-1 overflow-hidden">
      <main id="post-content" class="w-2/3 overflow-y-auto px-10">
        <article>
          <p class="uppercase text-s tracking-widest mb-3" style="color:#999;">Post 0:</p>
          <h2 class="serif text-3xl font-bold leading-tight mb-6">Welcome!</h2>
          <div class="post-body">
            <p>
              Welcome to my blog page! Here I write about all the cool stores, restaurants, 
              and otherwise local places I go to around Massachusetts and New England in general.
            </p>
          </div>
        </article>
      </main>
      
      <nav class="w-1/3 px-10 overflow-y-auto flex-shrink-0">
        <div class="py-4 border-b" style="border-color: var(--divider);">
          <p class="uppercase";>All Posts</p>
        </div>
        <div class="py-1"
          hx-get="posts/post.html"
          hx-target="#post-content"
          hx-swap="innerHTML">
          <p>Post 1</p>
        </div>
        <div class=""
          hx-get="posts/post2.html"
          hx-target="#post-content"
          hx-swap="innerHTML">
          <p>Post 2</p>
        </div>
        <div class="py-1"
          hx-get="posts/post3.html"
          hx-target="#post-content"
          hx-swap="innerHTML">
          <p>Post 3</p>
        </div>
      </nav>
    </div>
  </body>
</html>
